name: Deploy Backend (DEMO)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
      - "aws/task-definitions/backend-task-def.json"
  workflow_dispatch:

env:
  AWS_REGION:     ${{ vars.AWS_REGION }}        # e.g. ap-southeast-1
  ECR_REPOSITORY: ontract-backend
  ECS_CLUSTER:    ${{ vars.ECS_CLUSTER }}       # e.g. ontract-cluster
  ECS_SERVICE:    ontract-backend-svc
  CONTAINER_NAME: backend
  TASK_DEF_FILE:  aws/task-definitions/backend-task-def.json

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Materialise Firebase service-account JSON for the image
        run: |
          mkdir -p backend
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > backend/serviceAccountKey.json
          python3 -c "import json,sys; json.load(open('backend/serviceAccountKey.json'))"

      - name: Build & push image
        id: build
        env:
          REGISTRY:  ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker build -t $IMAGE -t $REGISTRY/$ECR_REPOSITORY:latest ./backend
          docker push $IMAGE
          docker push $REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      # DEMO: substitute env-var values from GitHub Secrets into the task def
      # directly. Production should use AWS Secrets Manager (see PRODUCTION_BACKLOG.md).
      - name: Render env values into task definition
        env:
          DATABASE_URL:     ${{ secrets.DATABASE_URL }}
          SECRET_KEY:       ${{ secrets.SECRET_KEY }}
          ENCRYPTION_KEY:   ${{ secrets.ENCRYPTION_KEY }}
          SMTP_HOST:        ${{ secrets.SMTP_HOST }}
          SMTP_PORT:        ${{ secrets.SMTP_PORT }}
          SMTP_USER:        ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:    ${{ secrets.SMTP_PASSWORD }}
          FROM_EMAIL:       ${{ secrets.FROM_EMAIL }}
          ALLOWED_ORIGINS:  ${{ vars.ALLOWED_ORIGINS }}
          PUBLIC_BASE_URL:  ${{ vars.PUBLIC_BASE_URL }}
          FRONTEND_URL:     ${{ vars.FRONTEND_URL }}
          AWS_ACCOUNT_ID:   ${{ secrets.AWS_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          chmod +x scripts/render-task-def.sh
          ./scripts/render-task-def.sh $TASK_DEF_FILE rendered-backend.json

      - name: Render image into rendered task def
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: rendered-backend.json
          container-name:  ${{ env.CONTAINER_NAME }}
          image:           ${{ steps.build.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service:         ${{ env.ECS_SERVICE }}
          cluster:         ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
