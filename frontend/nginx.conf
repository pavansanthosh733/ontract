# DEMO Nginx — serves the SPA. The frontend talks to the backend by
# its PUBLIC URL (set as VITE_BACKEND_URL at build time), so no reverse
# proxy of /api is needed. Production version (see PRODUCTION_BACKLOG.md)
# uses Service Connect + a /api proxy block instead.

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml application/font-woff2;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # SPA fallback (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|otf|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
